name: WSN 24/7 Channel Branding
on:
  push:
    paths:
      - .github/workflows/branding.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: channel-branding
  cancel-in-progress: false
jobs:
  branding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Apply channel logo, title, description and pinned welcome
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python branding.py
